# Optional local fixture for comparing client behavior against satip-lab and
# an independent SAT>IP implementation. This is not part of the default CI gate.
services:
  satip-lab:
    build:
      context: ../..
    image: satip-lab:cross-implementation
    ports:
      - "18875:8875"
      - "1554:554"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SATIP_LAB_PUBLIC_HOST: 127.0.0.1
      SATIP_LAB_PUBLIC_HTTP_PORT: "18875"
      SATIP_LAB_PUBLIC_RTSP_PORT: "1554"
      SATIP_LAB_SSDP_PORT: "0"
      SATIP_LAB_PROFILE: generic-satip-1.2

  minisatip:
    image: lscr.io/linuxserver/minisatip:latest
    ports:
      - "28875:8875"
      - "2554:554"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      RUN_OPTS: "-a 1:0:0 -G"
    volumes:
      - minisatip-config:/config

volumes:
  minisatip-config:
